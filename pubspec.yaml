name: flutter_phonetics
description: >-
  Finds sound-alike spellings of Bangla and English words with a match
  percentage. Runs on a background thread on every Flutter platform.
version: 0.1.0
repository: https://github.com/zakaria5729/flutter_phonetics
issue_tracker: https://github.com/zakaria5729/flutter_phonetics/issues
topics:
  - phonetics
  - bangla
  - nlp
  - search
  - isolate

environment:
  sdk: ^3.5.0

dependencies:
  web: ^1.1.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:
